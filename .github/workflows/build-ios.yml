name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch: # Permite disparar manualmente com 1 clique no GitHub
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Compilar IPA para iOS
    runs-on: macos-15 # macOS com suporte completo e nativo ao Xcode 16

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Xcode 16 (Exigido pelo React Native 0.88 / Expo SDK 58)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16'

      - name: 3. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 4. Vincular Node.js para os Scripts do Xcode
        run: |
          sudo ln -sf "$(which node)" /usr/local/bin/node
          sudo ln -sf "$(which node)" /opt/homebrew/bin/node || true
          echo "NODE_BINARY=$(which node)" >> $GITHUB_ENV
          echo "PATH=$(dirname $(which node)):$PATH" >> $GITHUB_ENV

      - name: 5. Instalar Dependências do Projeto
        run: npm ci --legacy-peer-deps

      - name: 6. Gerar Projeto Nativo iOS (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: 7. Instalar CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: 8. Compilar App Nativo com xcodebuild (Ad-Hoc para Sideloadly)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Finz.xcworkspace \
                     -scheme Finz \
                     -configuration Release \
                     -destination "generic/platform=iOS" \
                     -derivedDataPath ios/build \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     build 2>&1 | tee xcodebuild.log

      - name: Diagnosticar Erros do Xcode (Se houver falha)
        if: failure()
        run: |
          echo "=== ERROS IDENTIFICADOS NO LOG ==="
          grep -E "(error:|fatal error:|\*\* BUILD FAILED \*\*)" xcodebuild.log -A 2 -B 2 || tail -n 60 xcodebuild.log

      - name: 9. Empacotar .app em .ipa para Sideloadly
        run: |
          mkdir -p build_output/Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app build_output/Payload/
          cd build_output
          zip -r Finz-unsigned.ipa Payload
          cd ..

      - name: 10. Disponibilizar download do .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Finz-iOS-Unsigned
          path: build_output/Finz-unsigned.ipa
          retention-days: 14
